<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/style-criarTarefa.css' %}">
<title>{% if editando %}Editar{% else %}Criar{% endif %} Tarefa</title>
</head>
<body>

<div class="container">
    <h1>{% if editando %}Editando Tarefa{% else %}Criando Tarefa{% endif %}</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="titulo">Adicione Título:</label>
        <input type="text" id="titulo" name="titulo" placeholder="Adicione Título"
               value="{{ tarefa.titulo|default:'' }}" required>

        <label for="descricao">Adicione Descrição:</label>
        <textarea id="descricao" name="descricao" placeholder="Adicione Descrição">{{ tarefa.descricao|default:'' }}</textarea>

        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="pendente" {% if tarefa.status == 'pendente' %}selected{% endif %}>Pendente</option>
            <option value="andamento" {% if tarefa.status == 'andamento' %}selected{% endif %}>Em andamento</option>
            <option value="concluida" {% if tarefa.status == 'concluida' %}selected{% endif %}>Concluída</option>
        </select>

        <label for="data">Data de Conclusão:</label>
        <input type="date" id="data" name="data" value="{{ tarefa.data_conclusao|date:'Y-m-d' }}">

        <div class="botoes">
            {% if editando %}
                <a href="{% url 'deletar_tarefa' tarefa.id %}" class="btn btn-deletar">DELETAR</a>
                <button type="submit" class="btn btn-criar">SALVAR</button>
            {% else %}
                <button type="submit" class="btn btn-criar">CRIAR</button>
            {% endif %}
        </div>
    </form>
</div>

</body>
</html>
